services:
  db:
    image: postgres:16
    container_name: ${DB_CONTAINER_NAME:-postgres_db_dev}
    env_file:
      - .env.dev
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ${API_CONTAINER_NAME:-spring_api_dev}
    env_file:
      - .env.dev
    ports:
      - "${API_PORT:-8080}:8080"
      - "${DEBUG_PORT:-5005}:5005"
    volumes:
      - ./backend:/app
      - ./logs/dev:/app/logs
    depends_on:
      - db

volumes:
  postgres_data_dev:
