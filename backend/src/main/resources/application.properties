spring.application.name=backend
spring.profiles.default=dev

spring.datasource.driver-class-name=org.postgresql.Driver

# Activation de Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Configuration Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logs applicatifs : surchargeable avec la variable d'environnement LOG_FILE.
logging.file.name=${LOG_FILE:logs/backend.log}
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE:logs/backend}.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n
