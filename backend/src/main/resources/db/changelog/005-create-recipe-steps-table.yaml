databaseChangeLog:
  - changeSet:
      id: 20260304-005
      author: david
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: recipe_steps
      changes:
        - createTable:
            tableName: recipe_steps
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_recipe_steps_recipes
                    references: recipes(id)
              - column:
                  name: step_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: recipe_id, step_number
            constraintName: unique_recipe_step_number
            tableName: recipe_steps
