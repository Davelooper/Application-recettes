databaseChangeLog:
  - changeSet:
      id: 20260304-008
      author: david
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: ingredient_seasons
      changes:
        - createTable:
            tableName: ingredient_seasons
            columns:
              - column:
                  name: ingredient_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ingredient_seasons_ingredients
                    references: ingredients(ingredient_id)
              - column:
                  name: seasonality_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ingredient_seasons_seasonality
                    references: seasonality(id)
        - addPrimaryKey:
            columnNames: ingredient_id, seasonality_id
            constraintName: pk_ingredient_seasons
            tableName: ingredient_seasons
