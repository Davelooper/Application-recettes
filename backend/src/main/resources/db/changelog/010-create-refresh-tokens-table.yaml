databaseChangeLog:
  - changeSet:
      id: 20260410-010
      author: david
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: refresh_tokens
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refresh_tokens_users
                    references: users(id)
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP
              - column:
                  name: replaced_by_token_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addUniqueConstraint:
            columnNames: token_hash
            constraintName: unique_refresh_token_hash
            tableName: refresh_tokens
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expires_at
            columns:
              - column:
                  name: expires_at
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: replaced_by_token_id
            constraintName: fk_refresh_tokens_replaced_by
            referencedTableName: refresh_tokens
            referencedColumnNames: id
