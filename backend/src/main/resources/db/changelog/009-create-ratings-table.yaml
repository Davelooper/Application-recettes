databaseChangeLog:
  - changeSet:
      id: 20260304-009
      author: david
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: ratings
      changes:
        - createTable:
            tableName: ratings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ratings_recipes
                    references: recipes(id)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ratings_users
                    references: users(id)
              - column:
                  name: score
                  type: INT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: recipe_id, user_id
            constraintName: unique_recipe_user_rating
            tableName: ratings
        - sql:
            sql: ALTER TABLE ratings ADD CONSTRAINT check_score_range CHECK (score >= 1 AND score <= 5)
