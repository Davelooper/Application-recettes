# Connexion Base de Donnees
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Parametres JWT
security.jwt.access-token-secret=${JWT_ACCESS_TOKEN_SECRET}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
security.jwt.refresh-token-secret=${JWT_REFRESH_TOKEN_SECRET}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
security.jwt.issuer=${JWT_ISSUER:application-recettes-backend}
security.jwt.audience=${JWT_AUDIENCE:application-recettes-spa}
