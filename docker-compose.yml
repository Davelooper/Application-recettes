services:
  db:
    image: postgres:16
    container_name: ${DB_CONTAINER_NAME:-postgres_db}
    env_file:
      - .env.prod
    ports:
      - "${DB_PORT:-5432}:5432"

  api:
    build: ./backend
    container_name: ${API_CONTAINER_NAME:-spring_api}
    env_file:
      - .env.prod
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - db
